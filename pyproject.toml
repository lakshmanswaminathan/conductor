[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-agents"
version = "0.1.0"
description = "Local multi-agent orchestration with explicit, durable context merging"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
conductor = "conductor.cli:main"

[tool.setuptools.packages.find]
include = ["conductor*"]

[tool.setuptools.package-data]
conductor = ["web/*.html", "web/*.js", "web/*.css"]
